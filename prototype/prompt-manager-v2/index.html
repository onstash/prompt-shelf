<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#f7f7f5" />
<title>Relay Prototype 2 — Outcome First</title>
<style>
/* THROWAWAY UI PROTOTYPE #2 — Can prompt management disappear behind an outcome-first experience? */
:root{color-scheme:light;--bg:#f7f7f5;--ink:#1d1d1f;--muted:#76767a;--faint:#aaa9ad;--line:rgba(20,20,20,.1);--blue:#1768e5;--blue-hover:#0e5acb;--glass:rgba(255,255,255,.78);--ease:cubic-bezier(.23,1,.32,1);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--ink);letter-spacing:-.008em}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid rgba(23,104,229,.24);outline-offset:2px}svg{display:block}.app{min-height:100dvh;display:flex;flex-direction:column}.topbar{height:64px;padding:0 clamp(18px,4vw,48px);display:flex;align-items:center;justify-content:space-between;position:relative;z-index:4}.brand{font-weight:680;letter-spacing:-.03em;font-size:17px}.top-actions{display:flex;align-items:center;gap:6px}.quiet,.circle,.intent,.primary,.back,.saved-row{border:0;transition:transform 130ms var(--ease),background 150ms ease,color 150ms ease}.quiet{background:transparent;color:#5d5d61;padding:8px 10px;border-radius:9px}.quiet:hover{background:rgba(0,0,0,.045)}.circle{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.7);border:1px solid var(--line);display:grid;place-items:center}.circle:hover{background:#fff}.quiet:active,.circle:active,.intent:active,.primary:active,.back:active,.saved-row:active{transform:scale(.97)}
main{flex:1;display:grid;place-items:center;padding:42px 20px 96px}.stage{width:min(760px,100%);position:relative}.hero{text-align:center;transition:opacity 180ms var(--ease),transform 220ms var(--ease)}.hero.hidden{opacity:0;transform:translateY(-8px);pointer-events:none;position:absolute}.hello{color:var(--muted);font-size:14px;margin-bottom:10px}h1{font-size:clamp(36px,7vw,58px);line-height:1.03;letter-spacing:-.055em;font-weight:680;margin:0 auto;max-width:680px}h1 span{color:var(--faint)}.sub{color:var(--muted);font-size:16px;margin:18px auto 34px;max-width:500px}.intents{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.intent{min-height:110px;padding:16px;border-radius:18px;background:rgba(255,255,255,.68);border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.025)}.intent:hover{background:#fff;transform:translateY(-2px)}.intent-icon{width:34px;height:34px;border-radius:10px;background:#efefec;display:grid;place-items:center;color:#5d5d60}.intent strong{font-size:14px;font-weight:620}.more-row{margin-top:18px;display:flex;justify-content:center}.more-row .quiet{color:var(--muted)}
.composer{display:none;width:min(680px,100%);margin:auto;opacity:0;transform:translateY(10px);transition:opacity 200ms var(--ease),transform 260ms var(--ease)}.composer.active{display:block;opacity:1;transform:none}@starting-style{.composer.active{opacity:0;transform:translateY(10px)}}.composer-head{margin-bottom:24px}.back{border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:6px;padding:6px 0;margin-bottom:28px}.composer h2{font-size:clamp(28px,5vw,42px);letter-spacing:-.045em;line-height:1.08;margin:0;font-weight:670}.composer-note{color:var(--muted);margin:10px 0 0}.prompt-surface{background:var(--glass);backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:8px;box-shadow:0 12px 40px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.045)}textarea{width:100%;min-height:150px;max-height:320px;border:0;resize:vertical;background:transparent;padding:15px 16px 8px;font-size:17px;line-height:1.5;letter-spacing:-.015em}textarea:focus{outline:none}textarea::placeholder{color:#aaa9ad}.composer-tools{display:flex;align-items:center;justify-content:space-between;padding:8px}.context-button{border:0;background:transparent;color:var(--muted);height:38px;border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:7px}.context-button:hover{background:rgba(0,0,0,.045)}.primary{height:40px;border-radius:11px;border:0;background:var(--blue);color:#fff;padding:0 15px;display:flex;align-items:center;gap:8px;font-weight:610;box-shadow:0 1px 1px rgba(0,0,0,.1)}.primary:hover{background:var(--blue-hover)}.suggestion{margin-top:14px;color:var(--muted);font-size:13px;text-align:center}.suggestion button{border:0;background:transparent;color:var(--blue);padding:0}
.drawer{position:fixed;inset:0;z-index:10;pointer-events:none}.drawer.open{pointer-events:auto}.scrim{position:absolute;inset:0;background:rgba(25,25,26,.22);opacity:0;transition:opacity 180ms var(--ease)}.drawer.open .scrim{opacity:1}.panel{position:absolute;right:12px;top:12px;bottom:12px;width:min(420px,calc(100vw - 24px));background:rgba(250,250,248,.94);backdrop-filter:blur(30px) saturate(160%);border:1px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.2);transform:translateX(calc(100% + 20px));transition:transform 280ms cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden}.drawer.open .panel{transform:none}.panel-head{height:66px;padding:0 18px 0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.panel-head h2{font-size:18px;margin:0;letter-spacing:-.025em}.search{margin:14px 16px 8px;height:40px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.72);padding:0 12px}.search:focus{outline:none;border-color:rgba(23,104,229,.42);box-shadow:0 0 0 3px rgba(23,104,229,.09)}.saved-list{padding:6px 10px 18px;overflow:auto}.saved-row{width:100%;background:transparent;border-radius:13px;padding:13px 12px;display:flex;align-items:center;gap:12px;text-align:left}.saved-row:hover{background:rgba(0,0,0,.045)}.saved-icon{width:34px;height:34px;border-radius:10px;background:#ebebe8;display:grid;place-items:center;flex:none}.saved-copy{min-width:0}.saved-copy strong{display:block;font-size:14px;font-weight:610;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.saved-copy span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.toast{position:fixed;left:50%;bottom:24px;z-index:20;transform:translate(-50%,12px) scale(.98);opacity:0;background:rgba(29,29,31,.92);backdrop-filter:blur(18px);color:#fff;padding:10px 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13px;pointer-events:none;transition:opacity 170ms var(--ease),transform 210ms var(--ease)}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
@media(max-width:680px){.topbar{height:58px;padding:0 16px}.top-actions .quiet{font-size:0;width:36px;padding:0;display:grid;place-items:center}.top-actions .quiet svg{display:block}.hello{margin-bottom:8px}main{place-items:start center;padding-top:70px}.intents{grid-template-columns:1fr 1fr}.intent{min-height:98px}h1{font-size:40px}.sub{font-size:15px;margin-bottom:26px}.composer{padding-top:10px}.composer h2{font-size:34px}.panel{inset:auto 8px 8px;width:calc(100vw - 16px);height:min(70dvh,600px);transform:translateY(calc(100% + 18px))}.drawer.open .panel{transform:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}.intent:hover{transform:none}}@media(prefers-reduced-transparency:reduce){.prompt-surface,.panel,.toast{backdrop-filter:none}.prompt-surface,.panel{background:#fff}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand">Relay</div><div class="top-actions"><button class="quiet" id="savedButton"><svg style="display:none" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v16l-7-4-7 4z"/></svg>Saved</button><button class="circle" aria-label="Account"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 20c.7-4 3-6 7-6s6.3 2 7 6"/></svg></button></div></header>
<main><div class="stage">
<section class="hero" id="hero"><div class="hello">Good morning, Santosh</div><h1>What would you like <span>AI to help with?</span></h1><p class="sub">Choose an outcome. Relay will quietly use what has worked for you before.</p><div class="intents">
<button class="intent" data-intent="Write"><span class="intent-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10zM14 7l3 3"/></svg></span><strong>Write</strong></button>
<button class="intent" data-intent="Research"><span class="intent-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5M10 7v6M7 10h6"/></svg></span><strong>Research</strong></button>
<button class="intent" data-intent="Learn"><span class="intent-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 8 9-4 9 4-9 4zM6 10v5c3 2 9 2 12 0v-5"/></svg></span><strong>Learn</strong></button>
<button class="intent" data-intent="Plan"><span class="intent-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg></span><strong>Plan</strong></button>
</div><div class="more-row"><button class="quiet" id="otherButton">Something else <span aria-hidden="true">→</span></button></div></section>
<section class="composer" id="composer" aria-live="polite"><button class="back" id="backButton"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>Back</button><div class="composer-head"><h2 id="composerTitle">What are you writing?</h2><p class="composer-note" id="composerNote">Give Relay the rough idea. You can refine it after.</p></div><div class="prompt-surface"><textarea id="input" aria-label="Describe what you need" placeholder="Describe what you want to create…"></textarea><div class="composer-tools"><button class="context-button" id="attachButton"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m8 12 6-6a3 3 0 0 1 4 4l-8 8a4 4 0 0 1-6-6l8-8"/></svg>Add context</button><button class="primary" id="prepareButton">Prepare prompt <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button></div></div><p class="suggestion" id="suggestion">Using your saved <button>Clear first draft</button> recipe</p></section>
</div></main>
</div>
<div class="drawer" id="drawer"><div class="scrim" id="scrim"></div><aside class="panel" aria-label="Saved workflows"><div class="panel-head"><h2>Saved</h2><button class="circle" id="closeDrawer" aria-label="Close saved workflows"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><input class="search" type="search" placeholder="Search what worked before" aria-label="Search saved workflows"/><div class="saved-list"><button class="saved-row" data-open="Research"><span class="saved-icon">⌕</span><span class="saved-copy"><strong>Research with credible sources</strong><span>Used yesterday · improved 3 times</span></span></button><button class="saved-row" data-open="Write"><span class="saved-icon">✎</span><span class="saved-copy"><strong>Clear first draft</strong><span>Used 3 days ago · improved 5 times</span></span></button><button class="saved-row" data-open="Plan"><span class="saved-icon">✓</span><span class="saved-copy"><strong>Make a practical plan</strong><span>Used last week · improved once</span></span></button><button class="saved-row" data-open="Learn"><span class="saved-icon">◎</span><span class="saved-copy"><strong>Explain without oversimplifying</strong><span>Used 2 weeks ago · improved twice</span></span></button></div></aside></div>
<div class="toast" id="toast" role="status"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m5 12 4 4L19 6"/></svg><span>Prompt prepared and copied</span></div>
<script>
const copy={Write:['What are you writing?','Give Relay the rough idea. You can refine it after.','Describe what you want to create…','Clear first draft'],Research:['What do you want to understand?','Add the question, claim, or topic you want investigated.','What should the research clarify?','Research with credible sources'],Learn:['What would you like to learn?','Say what you know already—or where you feel stuck.','Explain the concept or question…','Explain without oversimplifying'],Plan:['What are you trying to accomplish?','Describe the outcome, constraints, and timing.','What needs a practical plan?','Make a practical plan'],Other:['What would you like help with?','Describe the outcome in your own words.','Tell Relay what a useful result looks like…','General purpose']};
const hero=document.querySelector('#hero'),composer=document.querySelector('#composer'),drawer=document.querySelector('#drawer'),input=document.querySelector('#input'),toast=document.querySelector('#toast');let current='Write';
function openComposer(intent){current=intent;const c=copy[intent]||copy.Other;document.querySelector('#composerTitle').textContent=c[0];document.querySelector('#composerNote').textContent=c[1];input.placeholder=c[2];document.querySelector('#suggestion').innerHTML=`Using your saved <button>${c[3]}</button> recipe`;hero.classList.add('hidden');composer.classList.add('active');setTimeout(()=>input.focus(),180)}
function closeComposer(){composer.classList.remove('active');hero.classList.remove('hidden');input.value=''}
function openDrawer(){drawer.classList.add('open');document.querySelector('.search').focus()}function closeDrawer(){drawer.classList.remove('open');document.querySelector('#savedButton').focus()}
document.querySelectorAll('[data-intent]').forEach(b=>b.onclick=()=>openComposer(b.dataset.intent));document.querySelector('#otherButton').onclick=()=>openComposer('Other');document.querySelector('#backButton').onclick=closeComposer;document.querySelector('#savedButton').onclick=openDrawer;document.querySelector('#closeDrawer').onclick=closeDrawer;document.querySelector('#scrim').onclick=closeDrawer;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{closeDrawer();openComposer(b.dataset.open)});document.querySelector('#attachButton').onclick=()=>showToast('Context attachment would open');document.querySelector('#prepareButton').onclick=async()=>{const text=`Help me ${current.toLowerCase()}: ${input.value||'the idea I describe next'}. Ask only essential clarifying questions, then produce a useful result.`;try{await navigator.clipboard.writeText(text)}catch{}showToast('Prompt prepared and copied')};function showToast(message){toast.querySelector('span').textContent=message;toast.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>toast.classList.remove('show'),1800)}document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(drawer.classList.contains('open'))closeDrawer();else if(composer.classList.contains('active'))closeComposer()}});
</script>
</body>
</html>
